name: Deploy Currency Convertor (Production)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Deploy to server using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # Create directory if it doesn't exist
            mkdir -p /home/qaiser/projects/currency_converter

            # Clean the directory but preserve the .env file if it exists
            cd /home/qaiser/projects/currency_converter
            find . -not -name '.env' -delete

      - name: 📂 Upload project files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "/home/qaiser/projects/currency_converter"
          strip_components: 0

      - name: 🔐 Upload .env file from secret
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -eu
            cd /home/qaiser/projects/currency_converter

            # ENV holds the long-standing base config (database, S3, rate APIs).
            echo '${{ secrets.ENV }}' | tr -d '\r' > .env.base

            # The news settings live in their own repository secrets so one value
            # can be rotated without rewriting the whole ENV blob. Strip any stale
            # copy out of the base file first: that way each key appears exactly
            # once and we never depend on which duplicate the parser prefers.
            grep -vE '^(OPENAI_API_KEY|OPENAI_MODEL|CRON_KEY|NEWS_WINDOW_DAYS|NEWS_INSIGHT_INTERVAL|NEWS_OPENAI_TIMEOUT)=' .env.base > .env || true
            rm -f .env.base

            # Append only the secrets that are actually set. An empty value here
            # would be worse than a missing one: the int fields would fail to
            # parse and the app would not boot, whereas an absent key falls back
            # to the default in app/core/config.py.
            append_if_set() {
              if [ -n "$2" ]; then
                printf '%s=%s\n' "$1" "$2" >> .env
              else
                echo "WARNING: $1 is empty — falling back to the default in app/core/config.py"
              fi
            }

            append_if_set OPENAI_API_KEY        '${{ secrets.OPENAI_API_KEY }}'
            append_if_set OPENAI_MODEL          '${{ secrets.OPENAI_MODEL }}'
            append_if_set CRON_KEY              '${{ secrets.CRON_KEY }}'
            append_if_set NEWS_WINDOW_DAYS      '${{ secrets.NEWS_WINDOW_DAYS }}'
            append_if_set NEWS_INSIGHT_INTERVAL '${{ secrets.NEWS_INSIGHT_INTERVAL }}'
            append_if_set NEWS_OPENAI_TIMEOUT   '${{ secrets.NEWS_OPENAI_TIMEOUT }}'

            # Names only — never the values.
            echo "Keys written to .env:"
            grep -oE '^[A-Za-z_][A-Za-z0-9_]*' .env | sort | tr '\n' ' '
            echo


      - name: 🐳 Run Docker + Alembic on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30m
          script: |
            set -eu
            cd /home/qaiser/projects/currency_converter
            docker compose down

            # --build is required, not optional. The compose file mounts the repo
            # at /app, so application code updates on every deploy without a
            # rebuild — but Python packages live in the image. Without --build a
            # newly added dependency is never installed, and the new code fails
            # at import time against last year's site-packages. That is exactly
            # how `openai` went missing in production.
            docker compose up -d --build

            sleep 15
            docker compose exec -T currency_convertor alembic upgrade head

            # Fail the deploy if a dependency did not make it into the image,
            # rather than leaving it to show up as a 503 from the news endpoint.
            docker compose exec -T currency_convertor python -c "import openai; print('openai', openai.__version__, 'OK')"